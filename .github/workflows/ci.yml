name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # libfluidsynth and the soundfont the FluidSynth reference was rendered with.
      - name: Install FluidSynth
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfluidsynth3 timgm6mb-soundfont

      - name: Cache pretrained weights
        id: weights
        uses: actions/cache@v4
        with:
          path: weights
          key: midi-ddsp-weights-urmp-9-10

      - name: Download pretrained weights
        if: steps.weights.outputs.cache-hit != 'true'
        run: tools/download_weights.sh

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      # Framework-dependent and RID-independent: runs with `dotnet midi-ddsp.dll`
      # on any OS with the .NET 8 runtime.
      - name: Publish portable build
        run: >
          dotnet publish src/MidiDdsp.Cli --no-restore -c Release
          -p:UseAppHost=false -o artifacts/midi-ddsp

      # Cross-compiled self-contained single file: midi-ddsp.exe runs on
      # Windows without .NET installed.
      - name: Publish Windows build
        run: |
          dotnet publish src/MidiDdsp.Cli -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None -o artifacts/midi-ddsp-win-x64
          file artifacts/midi-ddsp-win-x64/midi-ddsp.exe | grep -q "PE32+ executable (console) x86-64"

      # Bundle the pretrained checkpoints so the builds run out of the box;
      # the CLI looks for weights/ next to itself.
      - name: Add weights and docs to the builds
        run: |
          for dir in artifacts/midi-ddsp artifacts/midi-ddsp-win-x64; do
            dest=$dir/weights/midi_ddsp_model_weights_urmp_9_10
            mkdir -p $dest/expression_generator $dest/synthesis_generator
            cp weights/midi_ddsp_model_weights_urmp_9_10/expression_generator/5000.* $dest/expression_generator/
            cp weights/midi_ddsp_model_weights_urmp_9_10/synthesis_generator/50000.* $dest/synthesis_generator/
            cp tools/WEIGHTS-NOTICE.txt $dir/weights/NOTICE.txt
            cp README.md $dir/
          done

      - name: Smoke test the portable build with its bundled weights
        run: |
          cd "$RUNNER_TEMP"
          dotnet "$GITHUB_WORKSPACE/artifacts/midi-ddsp/midi-ddsp.dll" synthesize \
            "$GITHUB_WORKSPACE/tests/MidiDdsp.Tests/Reference/pipeline_test.mid" smoke.wav --seed 1
          test "$(stat -c %s smoke.wav)" -gt 100000

      - uses: actions/upload-artifact@v4
        with:
          name: midi-ddsp-portable
          path: artifacts/midi-ddsp
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: midi-ddsp-win-x64
          path: artifacts/midi-ddsp-win-x64
          if-no-files-found: error
